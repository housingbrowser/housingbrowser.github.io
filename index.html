
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.ico?v=8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Housing Browser</title>
  <style>
  </style>
</head>
<body>
  <p>Housing Browser</p>
  <div class="grid" id="grid">
    <button
      id="loadmore"
      onclick="fetchHouses()"
      style="
      aspect-ratio:  68 / 14;
      background-image:url('buttons/load/bup.png');
      background-size: contain;
      image-rendering: pixelated;
      background-repeat: no-repeat;
      background-position: center;
      border: none;
      width: 125px;
      appearance: none;
      outline: none;
      box-shadow: none;
      ">
    </button>
  <script>
  let page = 0;
  function fetchHouses() {
    const button = document.getElementById("loadmore");
    button.style.backgroundImage = "url('buttons/load/bdown.png')";
    fetch(`https://host1.creepernet.qzz.io/c8ee103f/api/houses?page=${page}&limit=10`)
      .then(response => response.json())
      .then(data => {
        const grid = document.getElementById("grid");
        for (const h of data.houses) {
          const box = document.createElement("div");
          box.className = "house";
          box.textContent = h.name;
          grid.appendChild(box);
        }
      grid.appendChild(document.getElementById("loadmore"));
      button.style.backgroundImage = "url('buttons/load/bup.png')";
      page++;
    });
  }
  </script>
</body>
</html>
