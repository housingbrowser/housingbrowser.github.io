
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="favicon.ico?v=8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Housing Browser</title>
  <style>
  </style>
</head>
<body>
  <p>Housing Browser</p>
  <div class="grid" id="grid">
    <button
      id="loadmore"
      onclick="fetchHouses()"
      style="
      aspect-ratio:  68 / 14;
      background-image:url('assets/buttons/load/bup.png');
      background-size: contain;
      image-rendering: pixelated;
      background-repeat: no-repeat;
      background-position: center;
      border: none;
      width: 125px;
      appearance: none;
      outline: none;
      box-shadow: none;
      ">
    </button>
  <script>
  async function getMinecraftUsername(uuid) {
    uuid = uuid.replace(/-/g, "");

    try {
        const response = await fetch(
            `https://mc-api.io/name/${uuid}`
        );

        if (!response.ok) return "???";

        const data = await response.json();
        return data.name;
    } catch {
        return "Unknown Player";
    }
}


  let page = 0;
  const button = document.getElementById("loadmore");

  function fetchHouses() {
    <!--Define Variables-->
    const seed = Math.floor(Math.random() * 1000000000);
    button.style.backgroundImage = "url('assets/buttons/load/bdown.png')";

    <!--Actual Function-->
    fetch(`https://host1.creepernet.qzz.io/c8ee103f/api/homepage?seed=${seed}&page=${page}&limit=10`)
      .then(response => response.json())
      <!--Process the Data-->
      .then(data => {
        const grid = document.getElementById("grid");

        for (const h of data.houses) {
          const box = document.createElement("div");
            box.className = "house";
          <!--House Name-->
          const housename = document.createElement("div");
          housename.className = "housename";
          housename.textContent = h.name;

          setMinecraftColors(housename, h.name)

          <!--Owner-->
          const owner = document.createElement("div");
          owner.className = "owner";
          owner.textContent = "Fetching Data";

          getMinecraftUsername(h.owner_uuid).then(username => {
            owner.textContent = "/visit " + username;
          });

          box.append(housename, owner);
          grid.appendChild(box);
        }
      grid.appendChild(document.getElementById("loadmore"));
      button.style.backgroundImage = "url('assets/buttons/load/bup.png')";
      page++;
    });
  }

  function setMinecraftColors(element, text) {
    text = text.normalize('NFKC');
    const colors = {
        '0': '#000000', '1': '#0000AA',
        '2': '#00AA00', '3': '#00AAAA',
        '4': '#AA0000', '5': '#AA00AA',
        '6': '#FFAA00', '7': '#AAAAAA',
        '8': '#555555', '9': '#5555FF',
        'a': '#55FF55', 'b': '#55FFFF',
        'c': '#FF5555', 'd': '#FF55FF',
        'e': '#FFFF55', 'f': '#FFFFFF'
    };

    element.replaceChildren();
    let currentColor = '#FFFFFF';
    let bold = false;
//This section detects color codes [0-9a-f] are the color code colors-->
    text.split(/(¤[0-9a-fk-or])/gi).forEach(part => {
        if (/^¤[0-9a-fk-or]$/i.test(part)) {
            const code = part[1].toLowerCase();
            currentColor = colors[part[1].toLowerCase()];
            if (colors[code]) {
              currentColor = colors[code];
              bold = false;
            } else if (code === 'l') {
              bold = true;
            } else if (code === 'r') {
              currentColor = '#FFFFFF';
              bold = false;
              }
            } else if (part) {
        // Use span to set the color of an element
          const span = document.createElement('span');
          span.style.color = currentColor || '#55FF55';
          span.style.fontWeight = bold ? 'bold' : 'normal';
          span.textContent = part;
          element.appendChild(span);
        }
    });
  }
  </script>
</body>
</html>
