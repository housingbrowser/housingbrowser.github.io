<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Housing Browser</title>
  <style>
  <link rel="icon" href="favicon.png">
  .grid {
    display: grid;
    grid-template-columns: 500px 1fr;
    gap: 4rem;
  }
  @font-face {
    font-family: "Minecraft";
    src: url("MinecraftDefault-Regular");
    font-weight: normal;
  }

  @font-face {
    font-family: "Minecraft";
    src: url("MinecraftDefaultBold.ttf");
    font-weight: bold;
  }
  img {
    image-rendering: pixelated;
  }
  body {
    font-size: 30px;
  }
  body {
    font-family: "Minecraft";
  }
  </style>
</head>
<body>
  <p>Housing Browse</p>
  <div class="grid">
  <div>1</div>
  <div>2</div>
  <div>3</div>
  <div>4</div>
  <div>5</div>
  <div>6</div>
  </div>
</body>
</html>
