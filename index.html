<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="favicon.ico?v=5" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Housing Browser</title>
  <style>
  .house {
    background-image: url("sprites/banner.png");
    background-size: 1px;
    background-size: cover;
    image-rendering: pixelated;
    min-height: 184px;
    min-width: 284px;
  }
  .grid {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 1rem;
  }
  @font-face {
    font-family: "Minecraft";
    src: url("fonts/MinecraftDefault-Regular.ttf");
    font-weight: normal;
  }

  @font-face {
    font-family: "Minecraft";
    src: url("fonts/MinecraftDefault-Bold.ttf");
    font-weight: bold;
  }
  img {
    image-rendering: pixelated;
  }
  body {
    font-family: "Minecraft", monospace;
    font-size: 30px;
  }
  </style>
</head>
<body>
  <p>Housing Browse</p>
  <div class="grid">
  <div class="house"></div>
  <div class="house"></div>
  <div class="house"></div>
  <div class="house"></div>
  </div>
</body>
</html>
